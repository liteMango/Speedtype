  <body>

    
    <div class="container">
      <div class="form-box login">
        <form action="#" id="login">
          <h1>Login</h1>
          <div id="signInMessage" class="messageDiv" style="display:none;" ></div>
          <div class="input-box">
            <input type="text" placeholder="Username" id="tName" required />
            <i class="bx bxs-user"></i>
          </div>
          <div class="input-box">
            <input type="email" placeholder="Email" id="tEmail" required />
            <i class="bx bxs-envelope"></i>
          </div>
          <div class="input-box">
            <input id="tPassword" type="password" placeholder="Password" required />
            <i class="bx bxs-lock-alt"></i>
          </div>
          <div class="forgot-link">
            <a href="#">Forgot Password?</a>
          </div>
          <button id="signIn" type="submit" class="btn">Login</button>
          <p>or login with social platforms</p>
          <div class="social-icons">
            <a href="#"><i class="bx bxl-google"></i></a>
            <a href="#"><i class="bx bxl-facebook"></i></a>
            <a href="#"><i class="bx bxl-github"></i></a>
            <a href="#"><i class="bx bxl-linkedin"></i></a>
          </div>
        </form>
      </div>

      <div class="form-box register">
        <form action="#" id="signup">
          <h1>Registration</h1>
          <div id="signUpMessage" class="messageDiv" style="display:none;" ></div>
          <div class="input-box">
            <input type="text" placeholder="Username" id="rName" required />
            <i class="bx bxs-user"></i>
          </div>
          <div class="input-box">
            <input type="email" placeholder="Email" id="rEmail" required />
            <i class="bx bxs-envelope"></i>
          </div>
          <div class="input-box">
            <input type="password" placeholder="Password" id="rPassword" required />
            <i class="bx bxs-lock-alt"></i>
          </div>
          <button id="signUp" type="submit" class="btn">Register</button>
          <p>or register with social platforms</p>
          <div class="social-icons">
            <a href="#"><i class="bx bxl-google"></i></a>
            <a href="#"><i class="bx bxl-facebook"></i></a>
            <a href="#"><i class="bx bxl-github"></i></a>
            <a href="#"><i class="bx bxl-linkedin"></i></a>
          </div>
        </form>
      </div>

      <div class="toggle-box">
        <div class="toggle-panel toggle-left">
          <h1>Hello, Welcome!</h1>
          <p>Don't have an account?</p>
          <button id="SignUp" class="btn register-btn">Register</button>
        </div>

        <div class="toggle-panel toggle-right">
          <h1>Welcome Back!</h1>
          <p>Already have an account?</p>
          <button id="SignIn" class="btn login-btn">Login</button>
        </div>
      </div>
    </div>

    <script type="module" src="/Login/login.js"></script>
    <script type="module" src="/Login/firebaseauth.js"></script>
